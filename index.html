<!DOCTYPE html> <html lang="fr"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Météo World - Températures</title> <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" /> <style> * { box-sizing: border-box; } body { margin: 0; font-family: Arial, sans-serif; background: #f4f6f8; } header { background: white; padding: 15px 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.12); position: relative; z-index: 1000; } header h1 { margin: 0; font-size: 24px; } header p { margin: 5px 0 0; color: #666; } #map { height: calc(100vh - 90px); width: 100%; } .legend { background: rgba(255,255,255,0.95); padding: 12px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.25); min-width: 220px; } .legend-title { font-weight: bold; margin-bottom: 8px; } .gradient { height: 18px; width: 200px; background: linear-gradient( to right, #4b0082, #4169e1, #00a6ff, #00b894, #8bc34a, #ffd32a, #ff9f1a, #ff5722, #d63031 ); border-radius: 4px; } .legend-values { display: flex; justify-content: space-between; font-size: 11px; margin-top: 4px; } </style> </head> <body> <header> <h1>🌡️ Météo World</h1> <p>Températures en France</p> </header> <div id="map"></div> <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script> <script> /* ============================================================ CARTE ============================================================ */ const map = L.map('map').setView([46.5, 2.5], 6); L.tileLayer( 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap contributors' } ).addTo(map); /* ============================================================ DONNÉES DE TEST ============================================================ Ces températures sont uniquement destinées à tester le rendu de la carte. Elles seront remplacées par la grille NOAA/GFS. */ const temperatures = [ { lat: 50.6, lon: 3.0, temp: 23 }, { lat: 49.0, lon: 2.0, temp: 25 }, { lat: 48.0, lon: 7.5, temp: 27 }, { lat: 47.2, lon: -1.5, temp: 24 }, { lat: 46.0, lon: 2.0, temp: 26 }, { lat: 45.0, lon: -1.0, temp: 29 }, { lat: 44.0, lon: 1.5, temp: 30 }, { lat: 43.5, lon: 3.5, temp: 32 }, { lat: 42.7, lon: 2.9, temp: 33 }, { lat: 43.3, lon: 5.4, temp: 31 }, { lat: 43.7, lon: 7.3, temp: 29 }, { lat: 45.8, lon: 4.8, temp: 28 }, { lat: 45.8, lon: 3.1, temp: 27 }, { lat: 47.3, lon: 5.0, temp: 26 } ]; /* ============================================================ COULEUR TEMPÉRATURE ============================================================ */ function temperatureColor(temp) { if (temp <= 0) return '#4b0082'; if (temp <= 5) return '#4169e1'; if (temp <= 10) return '#00a6ff'; if (temp <= 15) return '#00b894'; if (temp <= 20) return '#8bc34a'; if (temp <= 25) return '#ffd32a'; if (temp <= 30) return '#ff9f1a'; if (temp <= 35) return '#ff5722'; return '#d63031'; } /* ============================================================ COUCHE DE TEMPÉRATURE ============================================================ On utilise Leaflet.heat pour créer une interpolation visuelle entre les points. */ const script = document.createElement('script'); script.src = 'https://unpkg.com/leaflet.heat/dist/leaflet-heat.js'; script.onload = function() { const heatData = temperatures.map(point => { /* Conversion de la température en intensité. 0°C -> faible 35°C -> forte */ const intensity = Math.max(0.1, Math.min(1, point.temp / 35)); return [ point.lat, point.lon, intensity ]; }); L.heatLayer( heatData, { radius: 65, blur: 45, maxZoom: 8, minOpacity: 0.45, gradient: { 0.00: '#4b0082', 0.12: '#4169e1', 0.25: '#00a6ff', 0.40: '#00b894', 0.55: '#8bc34a', 0.68: '#ffd32a', 0.78: '#ff9f1a', 0.90: '#ff5722', 1.00: '#d63031' } } ).addTo(map); }; document.head.appendChild(script); /* ============================================================ LÉGENDE ============================================================ */ const legend = L.control({ position: 'bottomright' }); legend.onAdd = function() { const div = L.DomUtil.create( 'div', 'legend' ); div.innerHTML = ` <div class="legend-title"> Température </div> <div class="gradient"></div> <div class="legend-values"> <span>0°C</span> <span>5°C</span> <span>10°C</span> <span>15°C</span> <span>20°C</span> <span>25°C</span> <span>30°C</span> <span>35°C+</span> </div> `; return div; }; legend.addTo(map); </script> </body> </html>
