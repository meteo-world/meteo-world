<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Météo World - Températures</title>

<meta
name="description"
content="Carte des températures en France basée sur NOAA GFS."
>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: Arial, sans-serif;
}

body {
    background: #eef2f5;
}

header {
    height: 82px;
    background: white;
    padding: 12px 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
    position: relative;
    z-index: 2000;
}

header h1 {
    margin: 0;
    font-size: 24px;
}

header p {
    margin: 5px 0 0;
    color: #666;
    font-size: 14px;
}

#map {
    width: 100%;
    height: calc(100vh - 82px);
}

/* -----------------------------------
   VILLES
----------------------------------- */

.city-label {
    background: rgba(255,255,255,.94);
    border: 1px solid rgba(0,0,0,.25);
    border-radius: 5px;
    padding: 3px 6px;
    box-shadow: 0 1px 4px rgba(0,0,0,.25);
    text-align: center;
    white-space: nowrap;
}

.city-name {
    display: block;
    font-size: 10px;
    font-weight: normal;
}

.city-temp {
    font-size: 14px;
    font-weight: bold;
}

/* -----------------------------------
   LEGENDE
----------------------------------- */

.legend {
    background: rgba(255,255,255,.96);
    padding: 12px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,.25);
    width: 270px;
}

.legend-title {
    font-weight: bold;
    margin-bottom: 8px;
}

.gradient {
    height: 18px;
    border-radius: 4px;

    background: linear-gradient(
        to right,
        #4b0082 0%,
        #4169e1 12%,
        #00a6ff 25%,
        #00b894 40%,
        #8bc34a 55%,
        #ffd32a 68%,
        #ff9f1a 78%,
        #ff5722 90%,
        #d63031 100%
    );
}

.legend-values {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    margin-top: 4px;
}

.info {
    margin-top: 8px;
    font-size: 10px;
    color: #666;
}

.loading {
    position: absolute;
    top: 100px;
    left: 50%;
    transform: translateX(-50%);
    background: white;
    padding: 10px 15px;
    border-radius: 7px;
    box-shadow: 0 2px 8px rgba(0,0,0,.25);
    z-index: 3000;
}

/* -----------------------------------
   MOBILE
----------------------------------- */

@media(max-width:600px) {

    header {
        height: 70px;
        padding: 10px 15px;
    }

    header h1 {
        font-size: 20px;
    }

    header p {
        font-size: 12px;
    }

    #map {
        height: calc(100vh - 70px);
    }

    .legend {
        width: 210px;
    }

}

</style>

</head>


<body>

<header>

<h1>🌡️ Météo World</h1>

<p id="subtitle">
Chargement des données NOAA GFS...
</p>

</header>

<div id="loading" class="loading">
Chargement de la carte météo...
</div>

<div id="map"></div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

/* =====================================================
   CARTE
===================================================== */

const map = L.map("map", {
    zoomControl: true
});


/* =====================================================
   FOND DE CARTE
===================================================== */

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        attribution:
            "&copy; OpenStreetMap contributors",
        maxZoom: 18
    }
).addTo(map);


/* =====================================================
   VILLES
===================================================== */

const cities = [

    {name:"Paris",lat:48.8566,lon:2.3522},

    {name:"Marseille",lat:43.2965,lon:5.3698},

    {name:"Lyon",lat:45.7640,lon:4.8357},

    {name:"Toulouse",lat:43.6047,lon:1.4442},

    {name:"Nice",lat:43.7102,lon:7.2620},

    {name:"Nantes",lat:47.2184,lon:-1.5536},

    {name:"Montpellier",lat:43.6108,lon:3.8767},

    {name:"Strasbourg",lat:48.5734,lon:7.7521},

    {name:"Bordeaux",lat:44.8378,lon:-0.5792},

    {name:"Lille",lat:50.6292,lon:3.0573},

    {name:"Rennes",lat:48.1173,lon:-1.6778},

    {name:"Grenoble",lat:45.1885,lon:5.7245},

    {name:"Perpignan",lat:42.6886,lon:2.8948},

    {name:"Dijon",lat:47.3220,lon:5.0415},

    {name:"Clermont-Ferrand",lat:45.7772,lon:3.0870},

    {name:"Limoges",lat:45.8336,lon:1.2611},

    {name:"Tours",lat:47.3941,lon:0.6848},

    {name:"Orléans",lat:47.9030,lon:1.9093},

    {name:"Reims",lat:49.2583,lon:4.0317},

    {name:"Metz",lat:49.1193,lon:6.1757}

];


/* =====================================================
   COULEUR TEMPERATURE
===================================================== */

function temperatureColor(temp) {

    const stops = [

        [-5,  "#4b0082"],

        [0,   "#4169e1"],

        [5,   "#00a6ff"],

        [10,  "#00b894"],

        [15,  "#8bc34a"],

        [20,  "#ffd32a"],

        [25,  "#ff9f1a"],

        [30,  "#ff5722"],

        [35,  "#d63031"],

        [40,  "#a00000"]

    ];

    if (temp <= stops[0][0]) {
        return stops[0][1];
    }

    if (temp >= stops[stops.length-1][0]) {
        return stops[stops.length-1][1];
    }

    for (let i = 0; i < stops.length - 1; i++) {

        const t1 = stops[i][0];
        const c1 = stops[i][1];

        const t2 = stops[i+1][0];
        const c2 = stops[i+1][1];

        if (temp >= t1 && temp <= t2) {

            const ratio =
                (temp - t1) /
                (t2 - t1);

            return interpolateColor(
                c1,
                c2,
                ratio
            );
        }
    }
}


/* =====================================================
   INTERPOLATION COULEUR
===================================================== */

function interpolateColor(
    color1,
    color2,
    ratio
) {

    const r1 =
        parseInt(color1.substring(1,3),16);

    const g1 =
        parseInt(color1.substring(3,5),16);

    const b1 =
        parseInt(color1.substring(5,7),16);

    const r2 =
        parseInt(color2.substring(1,3),16);

    const g2 =
        parseInt(color2.substring(3,5),16);

    const b2 =
        parseInt(color2.substring(5,7),16);

    const r =
        Math.round(
            r1 + (r2-r1)*ratio
        );

    const g =
        Math.round(
            g1 + (g2-g1)*ratio
        );

    const b =
        Math.round(
            b1 + (b2-b1)*ratio
        );

    return "#" +

        r.toString(16).padStart(2,"0") +

        g.toString(16).padStart(2,"0") +

        b.toString(16).padStart(2,"0");
}


/* =====================================================
   CHARGEMENT DONNEES
===================================================== */

fetch(
    "data/temperatures.json?" +
    Date.now()
)

.then(response => {

    if (!response.ok) {

        throw new Error(
            "Impossible de charger temperatures.json"
        );
    }

    return response.json();
})

.then(weather => {

    document.getElementById(
        "loading"
    ).style.display = "none";


    document.getElementById(
        "subtitle"
    ).textContent =

        "Températures à 2 m — NOAA GFS 0,25° — "
        +
        weather.cycle;


    /*
    -----------------------------------------------------
    POINTS GFS
    -----------------------------------------------------
    */

    const points =
        weather.points;


    /*
    -----------------------------------------------------
    BOUNDS
    -----------------------------------------------------
    */

    const bounds = L.latLngBounds(

        [
            weather.area.south,
            weather.area.west
        ],

        [
            weather.area.north,
            weather.area.east
        ]

    );


    map.fitBounds(
        bounds,
        {
            padding: [10,10]
        }
    );


    /*
    -----------------------------------------------------
    GRILLE
    -----------------------------------------------------
    */

    const lats =
        [...new Set(
            points.map(p => p.lat)
        )].sort((a,b) => a-b);

    const lons =
        [...new Set(
            points.map(p => p.lon)
        )].sort((a,b) => a-b);


    const grid = {};


    points.forEach(p => {

        if (!grid[p.lat]) {
            grid[p.lat] = {};
        }

        grid[p.lat][p.lon] =
            p.temp;

    });


    /*
    -----------------------------------------------------
    CANVAS METEO
    -----------------------------------------------------
    */

    const WeatherLayer =
        L.Layer.extend({

            onAdd: function(map) {

                this._map = map;

                this._canvas =
                    L.DomUtil.create(
                        "canvas",
                        "weather-canvas"
                    );

                this._canvas.style.position =
                    "absolute";

                this._canvas.style.pointerEvents =
                    "none";

                map.getPanes()
                    .overlayPane
                    .appendChild(
                        this._canvas
                    );

                map.on(
                    "move zoom resize",
                    this._reset,
                    this
                );

                this._reset();

            },


            onRemove: function(map) {

                map.off(
                    "move zoom resize",
                    this._reset,
                    this
                );

                this._canvas.remove();

            },


            _reset: function() {

                const map =
                    this._map;

                const size =
                    map.getSize();

                const topLeft =
                    map.containerPointToLayerPoint(
                        [0,0]
                    );

                L.DomUtil.setPosition(
                    this._canvas,
                    topLeft
                );


                this._canvas.width =
                    size.x;

                this._canvas.height =
                    size.y;


                const ctx =
                    this._canvas.getContext(
                        "2d"
                    );


                /*
                ------------------------------------------------
                RESOLUTION D'AFFICHAGE
                ------------------------------------------------

                On travaille sur une grille
                intermédiaire afin d'obtenir
                un dégradé doux.
                */

                const step = 8;


                for (
                    let y = 0;
                    y < size.y;
                    y += step
                ) {

                    for (
                        let x = 0;
                        x < size.x;
                        x += step
                    ) {

                        const point =
                            map.layerPointToLatLng(
                                [
                                    x,
                                    y
                                ]
                            );


                        if (
                            point.lat <
                                weather.area.south ||
                            point.lat >
                                weather.area.north ||
                            point.lng <
                                weather.area.west ||
                            point.lng >
                                weather.area.east
                        ) {
                            continue;
                        }


                        const temp =
                            interpolateTemperature(
                                point.lat,
                                point.lng
                            );


                        if (
                            temp === null
                        ) {
                            continue;
                        }


                        ctx.fillStyle =
                            temperatureColor(
                                temp
                            );


                        ctx.globalAlpha =
                            0.72;


                        ctx.fillRect(
                            x,
                            y,
                            step + 1,
                            step + 1
                        );

                    }

                }


                ctx.globalAlpha = 1;

            }

        });


    /*
    -----------------------------------------------------
    INTERPOLATION BILINEAIRE
    -----------------------------------------------------
    */

    function interpolateTemperature(
        lat,
        lon
    ) {

        if (
            lat < lats[0] ||
            lat > lats[lats.length-1] ||
            lon < lons[0] ||
            lon > lons[lons.length-1]
        ) {
            return null;
        }


        /*
        Trouver les indices
        */

        let i = 0;

        while (
            i < lats.length - 2 &&
            lats[i+1] < lat
        ) {
            i++;
        }


        let j = 0;

        while (
            j < lons.length - 2 &&
            lons[j+1] < lon
        ) {
            j++;
        }


        const lat1 =
            lats[i];

        const lat2 =
            lats[i+1];

        const lon1 =
            lons[j];

        const lon2 =
            lons[j+1];


        const q11 =
            grid[lat1]?.[lon1];

        const q12 =
            grid[lat1]?.[lon2];

        const q21 =
            grid[lat2]?.[lon1];

        const q22 =
            grid[lat2]?.[lon2];


        if (
            q11 === undefined ||
            q12 === undefined ||
            q21 === undefined ||
            q22 === undefined
        ) {
            return null;
        }


        const x =
            (lon-lon1) /
            (lon2-lon1);

        const y =
            (lat-lat1) /
            (lat2-lat1);


        const top =
            q11 +
            (q12-q11)*x;


        const bottom =
            q21 +
            (q22-q21)*x;


        return (
            top +
            (bottom-top)*y
        );

    }


    /*
    -----------------------------------------------------
    AJOUT DE LA COUCHE
    -----------------------------------------------------
    */

    const weatherLayer =
        new WeatherLayer();

    weatherLayer.addTo(map);


    /*
    -----------------------------------------------------
    CONTOUR DE LA FRANCE
    -----------------------------------------------------
    */

    fetch(
        "https://raw.githubusercontent.com/gregoiredavid/france-geojson/master/metropole.geojson"
    )

    .then(response => response.json())

    .then(france => {

        L.geoJSON(
            france,
            {

                style: {

                    color: "#333",

                    weight: 1.5,

                    opacity: .8,

                    fillOpacity: 0

                }

            }

        ).addTo(map);

    });


    /*
    -----------------------------------------------------
    TEMPERATURE DES VILLES
    -----------------------------------------------------
    */

    function nearestTemperature(
        lat,
        lon
    ) {

        let nearest = null;

        let distance =
            Infinity;


        points.forEach(point => {

            const dLat =
                point.lat-lat;

            const dLon =
                point.lon-lon;


            const d =
                dLat*dLat +
                dLon*dLon;


            if (d < distance) {

                distance = d;

                nearest =
                    point.temp;

            }

        });


        return nearest;

    }


    cities.forEach(city => {

        const temp =
            nearestTemperature(
                city.lat,
                city.lon
            );


        if (
            temp === null
        ) {
            return;
        }


        const icon =
            L.divIcon({

                className: "",

                html:

                    '<div class="city-label">'
                    +

                    '<span class="city-name">'
                    +
                    city.name
                    +
                    '</span>'

                    +

                    '<span class="city-temp">'
                    +
                    Math.round(temp)
                    +
                    "°"
                    +
                    "</span>"

                    +
                    "</div>",

                iconSize:
                    [65,38],

                iconAnchor:
                    [32,19]

            });


        L.marker(
            [
                city.lat,
                city.lon
            ],
            {
                icon: icon
            }
        )

        .addTo(map)

        .bindPopup(

            "<strong>"
            +
            city.name
            +
            "</strong><br>"
            +

            "Température GFS : "
            +

            "<strong>"
            +
            temp.toFixed(1)
            +
            " °C"
            +
            "</strong>"

        );

    });


    /*
    -----------------------------------------------------
    LEGENDE
    -----------------------------------------------------
    */

    const legend =
        L.control({
            position: "bottomright"
        });


    legend.onAdd =
        function() {

            const div =
                L.DomUtil.create(
                    "div",
                    "legend"
                );


            div.innerHTML = `

                <div class="legend-title">
                    Température à 2 m
                </div>

                <div class="gradient"></div>

                <div class="legend-values">

                    <span>0°</span>
                    <span>5°</span>
                    <span>10°</span>
                    <span>15°</span>
                    <span>20°</span>
                    <span>25°</span>
                    <span>30°</span>
                    <span>35°+</span>

                </div>

                <div class="info">

                    Source : NOAA GFS 0,25°

                    <br>

                    Cycle :
                    ${weather.cycle}

                </div>

            `;


            return div;

        };


    legend.addTo(map);

})


.catch(error => {

    console.error(error);

    document.getElementById(
        "loading"
    ).textContent =
        "Erreur de chargement des données météo.";

});

</script>

</body>

</html>
